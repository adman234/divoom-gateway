esphome:
  name: divoom-gateway
  friendly_name: Divoom Gateway

esp32:
  # Olimex ESP32-POE-ISO (galvanically isolated Ethernet+PoE). For the
  # non-isolated ESP32-POE, use board: esp32-poe instead.
  board: esp32-poe-iso
  framework:
    # BluetoothSerial (Bluetooth Classic / SPP) is only available under the
    # Arduino framework, not esp-idf. Bluetooth Classic itself only exists on
    # the original dual-core ESP32 - not S2/S3/C3/C6, so this rules out the
    # Ethernet-over-SPI (W5500) XIAO-style boards, which use those chips.
    type: arduino

external_components:
  - source:
      type: git
      url: https://github.com/adman234/divoom-gateway
      ref: esphome
    components: [divoom_gateway]
    # this branch is under active development - always re-fetch instead of
    # using ESPHome's default 1-day cache, so `esphome run` picks up new
    # commits immediately. Raise this (or remove it) once the branch is stable.
    refresh: 0s

logger:
api:
  encryption:
    key: !secret api_encryption_key
ota:
  - platform: esphome
    password: !secret ota_password
mdns:
web_server:
  port: 80

# Olimex ESP32-POE / ESP32-POE-ISO pinout (LAN8720 PHY over RMII). The WROVER
# variant of these boards moves the clock pin to GPIO0 instead of GPIO17 -
# check which module is on your board if link doesn't come up.
ethernet:
  type: LAN8720
  mdc_pin: GPIO23
  mdio_pin: GPIO18
  clk:
    pin: GPIO17
    mode: CLK_OUT
  phy_addr: 0
  power_pin: GPIO12

divoom_gateway:
  id: gateway
  tcp_port: 7777
  bluetooth_filter: true
  # pin: "0000"  # uncomment if your Divoom device requires an SPP pairing PIN

# Optional: surface gateway status as native Home Assistant entities instead
# of the standalone firmware's custom web status page.
binary_sensor:
  - platform: template
    name: "Bluetooth Connected"
    lambda: return id(gateway).get_bluetooth_connected();

sensor:
  - platform: template
    name: "Discovered Divoom Devices"
    lambda: return id(gateway).get_discovered_devices().size();
    update_interval: 30s
